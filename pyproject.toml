[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-contract-review"
version = "0.1.0"
description = "Local evidence-based parsing of Russian supply documents"
requires-python = ">=3.11"
dependencies = ["streamlit==1.66.1", "pandas>=2.2,<4", "jinja2>=3.1,<4"]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
